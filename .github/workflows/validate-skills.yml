name: Validate Skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Agent Skills reference validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate every skill against the Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r skill_dir; do
            echo "Validating ${skill_dir}"
            skills-ref validate "${skill_dir}"
          done < <(find skills -mindepth 1 -maxdepth 1 -type d | sort)

      - name: Compile Python scripts
        shell: bash
        run: |
          set -euo pipefail
          find skills -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

      - name: Run lint self-tests
        run: |
          python skills/oil-tone/scripts/tone_lint.py --self-test
          python skills/dou-tone/scripts/dou_lint.py --self-test
